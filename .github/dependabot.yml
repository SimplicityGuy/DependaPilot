---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - "SimplicityGuy"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-version:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    assignees:
      - "SimplicityGuy"
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      uv-version:
        applies-to: version-updates
        patterns: ["*"]
