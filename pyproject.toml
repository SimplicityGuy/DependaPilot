[project]
name = "dependapilot"
version = "0.1.0"
description = "Automated dependency update orchestration"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
dependapilot = "dependapilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependapilot"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
