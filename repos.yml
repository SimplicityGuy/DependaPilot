# DependaPilot fleet configuration.
#
# This file is the source of truth for which GitHub repositories
# DependaPilot manages and the policy knobs the audit and dashboard read.
# Schema is enforced by src/dependapilot/config.py (FleetConfig) — unknown
# keys, malformed "owner/repo" slugs, and unrecognized merge_method values
# all fail to load with a clear error.

defaults:
  # How DependaPilot merges a Dependabot PR when it takes the "merge" action.
  # One of: merge | squash | rebase.
  merge_method: merge
  # Floor, in days, below which a repo's Dependabot cooldown config is
  # flagged as weakening GitHub's native release cooldown.
  cooldown_floor_days: 3

repos:
  # Audit (the config-audit pass -- dependabot.yml schema + completeness +
  # security settings + cooldown checks) is on by default for every repo.
  # actions: true opts a repo into fleet actions (approve/merge/rebase and
  # the bulk toolbar on the dashboard); it defaults to off as a guardrail.
  - repo: SimplicityGuy/DependaPilot
    actions: true

  # Overrides the fleet's default merge method for this repo only.
  - repo: SimplicityGuy/discogsography
    merge_method: squash
    actions: true

  - repo: SimplicityGuy/cronduit
    actions: true

  - repo: SimplicityGuy/phaze
    merge_method: merge
    actions: true
