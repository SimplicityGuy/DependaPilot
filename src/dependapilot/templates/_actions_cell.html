{% set cell_id = "actions-" ~ owner ~ "-" ~ repo_name ~ "-" ~ number %}
<span class="actions-cell" id="{{ cell_id }}">
  {% if outcome %}
  <p class="action-note {{ 'action-ok' if outcome.ok else 'action-fail' }}">
    {{ outcome.action|capitalize }}: {{ outcome.outcome.value }}{% if outcome.message %} &mdash; {{ outcome.message }}{% endif %}
  </p>
  {% endif %}
  {% if not outcome or outcome.outcome.value != "merged" %}
  <form
    hx-post="/repos/{{ owner }}/{{ repo_name }}/pulls/{{ number }}/approve"
    hx-target="#{{ cell_id }}"
    hx-swap="outerHTML"
    onclick="event.stopPropagation()"
  >
    <input type="hidden" name="sha" value="{{ head_sha }}" />
    <button type="submit" class="btn btn-row">Approve</button>
  </form>
  <form
    hx-post="/repos/{{ owner }}/{{ repo_name }}/pulls/{{ number }}/merge"
    hx-target="#{{ cell_id }}"
    hx-swap="outerHTML"
    hx-confirm="Merge {{ owner }}/{{ repo_name }} #{{ number }}? This cannot be undone."
    onclick="event.stopPropagation()"
  >
    <input type="hidden" name="sha" value="{{ head_sha }}" />
    <button
      type="submit"
      class="btn btn-row btn-primary{{ ' btn-disabled' if not ci_green else '' }}"
      {% if not ci_green %}disabled title="CI must be green to merge"{% endif %}
    >
      Merge
    </button>
  </form>
  <form
    hx-post="/repos/{{ owner }}/{{ repo_name }}/pulls/{{ number }}/rebase"
    hx-target="#{{ cell_id }}"
    hx-swap="outerHTML"
    onclick="event.stopPropagation()"
  >
    <input type="hidden" name="sha" value="{{ head_sha }}" />
    <button type="submit" class="btn btn-row">Rebase</button>
  </form>
  {% endif %}
</span>
