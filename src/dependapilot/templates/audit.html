<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DependaPilot — Audit</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/vendor/htmx.min.js"></script>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="none">
          <path d="M1.8 8.6l12.4-6-4.6 12-2.3-4.4L1.8 8.6z" fill="#2DD4BF"></path>
          <path d="M7.3 10.2l6.9-7.6" stroke="#0B1015" stroke-width="0.9"></path>
        </svg>
        <span class="wordmark">DependaPilot</span>
      </div>
      <nav class="navtabs">
        <a href="/" class="navtab">Fleet</a>
        <span class="navtab navtab-active">Audit</span>
      </nav>
      <div class="topbar-spacer"></div>
      <span class="mono topbar-synced">audited just now</span>
      <button class="btn" type="button" title="Refresh the audit view below">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13.2 8A5.2 5.2 0 1 1 11.6 4.2"></path>
          <path d="M13.4 1.8v3h-3"></path>
        </svg>
        Re-audit all
      </button>
    </div>

    <main class="page">
      <p class="subtitle">Config audit: findings, suggested fixes, and one-click fix PRs.</p>

      <div id="audit-list" hx-get="/audit/list" hx-trigger="load" hx-swap="outerHTML">
        <p class="fleet-empty">Loading audit…</p>
      </div>
    </main>

    <footer class="footer">
      <span class="mono">every call goes through the gh CLI — your gh login is the only credential · merge needs green CI, always</span>
    </footer>
  </body>
</html>
